// 고른 선택지 배열 → 유형 코드("AIP" 등)와 축별 점수
function computeType(picks) {
  const scores = {};
  const code = GAME.axes.map(ax => {
    let l = 0, r = 0, last = null;
    picks.forEach(c => c.tags.forEach(t => {
      if (t === ax.left)  { l++; last = t; }
      if (t === ax.right) { r++; last = t; }
    }));
    scores[ax.left] = l; scores[ax.right] = r;
    if (l > r) return ax.left;
    if (r > l) return ax.right;
    return last || ax.default;
  }).join("");
  return { code, scores };
}

    --sky: #6cc4ff;
    --white: #fffdf7;
    --line: 4px;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background-color: var(--cream);
    background-image: radial-gradient(rgba(42,26,18,.09) 2px, transparent 2.5px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: "Jua", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    min-height: 100vh;
    min-height: 100dvh;
  }
  #app.shake { animation: shake .45s ease-out; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    15% { transform: translate(-7px, 4px); }
    30% { transform: translate(6px, -4px); }
    45% { transform: translate(-5px, 2px); }
    60% { transform: translate(4px, -2px); }
    80% { transform: translate(-2px, 1px); }
  }

  /* ---------- 화면 전환 ---------- */
  .screen { display: none; }
  .screen.active { display: block; animation: popIn .4s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popIn { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }

  /* ---------- 공통 요소 ---------- */
  .btn {
    font-family: "Jua", sans-serif;
    font-size: 22px;
    color: var(--white);
    background: var(--tomato);
    border: var(--line) solid var(--ink);
    border-radius: 999px;
    padding: 14px 36px 12px;
    box-shadow: 0 7px 0 var(--ink);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s, filter .15s;
    text-shadow: 0 2px 0 rgba(0,0,0,.18);
    touch-action: manipulation;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(7px); box-shadow: 0 0 0 var(--ink); }
  .btn.yellow { background: var(--mustard); color: var(--ink); text-shadow: none; }
  .btn.mint { background: var(--mint); color: var(--ink); text-shadow: none; }
  .btn.white { background: var(--white); color: var(--ink); text-shadow: none; }
  .btn-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }

  .panel {
    background: var(--white);
    border: var(--line) solid var(--ink);
    border-radius: var(--radius);
    box-shadow: 0 7px 0 var(--ink);
    padding: 20px;
  }
  .chip {
    display: inline-block;
    font-size: 17px;
    background: var(--mustard);
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 4px 14px 2px;
    box-shadow: 0 3px 0 var(--ink);
  }

  /* ---------- Ant 캐릭터 ---------- */
  .ant { display: block; width: 100%; height: auto; overflow: visible; }
  .ant .bob { animation: bob 1.6s ease-in-out infinite; transform-box: view-box; transform-origin: 100px 220px; }
  .ant .antenna-l { animation: wiggleL 2.2s ease-in-out infinite; transform-box: view-box; transform-origin: 84px 48px; }
  .ant .antenna-r { animation: wiggleR 2.2s ease-in-out infinite; transform-box: view-box; transform-origin: 116px 48px; }
  .ant .arm-r { animation: wave 1.1s ease-in-out infinite; transform-box: view-box; transform-origin: 120px 140px; }
  .ant .eyes { animation: blink 4s infinite; transform-box: view-box; transform-origin: 100px 92px; }
  @keyframes bob { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-5px) scaleY(1.02); } }
  @keyframes wiggleL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-9deg); } }
  @keyframes wiggleR { 0%,100% { transform: rotate(0); } 50% { transform: rotate(9deg); } }
  @keyframes wave { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-22deg); } }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .ant.cheer .arm-l { animation: waveL 0.7s ease-in-out infinite; transform-box: view-box; transform-origin: 80px 140px; }
  .ant.cheer .bob { animation: hop .7s ease-in-out infinite; }
  @keyframes waveL { 0%,100% { transform: rotate(0); } 50% { transform: rotate(22deg); } }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

  /* ---------- 시작 화면 ---------- */
  #start { text-align: center; padding-top: 4vh; }
  .title {
    font-family: "Black Han Sans", "Jua", sans-serif;
    font-size: clamp(42px, 11vw, 76px);
    line-height: 1.1;
    color: var(--mustard);
    margin: 10px 0 0;
    letter-spacing: 1px;
    text-shadow:
      3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 3px 0 var(--ink), 0 -3px 0 var(--ink),
      2.5px 2.5px 0 var(--ink), -2.5px 2.5px 0 var(--ink), 2.5px -2.5px 0 var(--ink), -2.5px -2.5px 0 var(--ink),
      0 9px 0 var(--ink);
  }
  .title .accent { color: var(--tomato); }
  .subtitle { font-size: clamp(17px, 4.4vw, 21px); line-height: 1.55; white-space: pre-line; margin: 18px auto 0; max-width: 30em; }
  .hero { position: relative; width: min(64vw, 270px); margin: 22px auto 0; }
  .hero::before {
    content: ""; position: absolute; inset: 8% -6% 0; z-index: -1;
    background: var(--mint); border: var(--line) solid var(--ink); border-radius: 50%;
  }
  .nametag {
    display: inline-block; margin-top: -8px; position: relative;
    background: var(--tomato); color: var(--white); font-size: 20px;
    border: 3px solid var(--ink); border-radius: 12px; padding: 4px 16px 2px;
    box-shadow: 0 4px 0 var(--ink); transform: rotate(-3deg);
  }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: -1; overflow: hidden; }
  .confetti span {
    position: absolute; width: 22px; height: 22px; border: 3px solid var(--ink); border-radius: 50%;
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-18px) rotate(20deg); } }

  /* ---------- 선택 화면 ---------- */
  .progress { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .progress .segs { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .progress .seg {
    height: 18px; background: var(--white); border: 3px solid var(--ink); border-radius: 999px;
    transition: background .3s;
  }
  .progress .seg.done { background: var(--tomato); }
  .progress .seg.now { background: var(--mustard); }
  .progress .count { font-size: 20px; min-width: 3.2em; text-align: right; }

  .scene { display: flex; align-items: flex-end; gap: 10px; margin: 8px 0 22px; }
  .scene .ant-wrap { flex: 0 0 auto; width: clamp(86px, 24vw, 130px); }
  .bubble {
    position: relative; flex: 1;
    background: var(--white); border: var(--line) solid var(--ink); border-radius: 24px;
    padding: 16px 18px 14px; box-shadow: 0 6px 0 var(--ink);
    font-size: clamp(19px, 4.8vw, 24px); line-height: 1.45; margin-bottom: 30px;
  }
  .bubble::before, .bubble::after { content: ""; position: absolute; top: auto; bottom: 18px; width: 0; height: 0; border-style: solid; }
  .bubble::before { left: -20px; border-width: 11px 20px 11px 0; border-color: transparent var(--ink) transparent transparent; }
  .bubble::after  { left: -13px; bottom: 21px; border-width: 8px 15px 8px 0; border-color: transparent var(--white) transparent transparent; }
  .bubble .chip { margin-bottom: 10px; }
  .bubble p { margin: 0; }

  .choices { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 620px) { .choices { grid-template-columns: 1fr 1fr; } }
  .card {
    display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
    font-family: "Jua", sans-serif; font-size: 19px; line-height: 1.35; color: var(--ink);
    background: var(--white); border: var(--line) solid var(--ink); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: 0 6px 0 var(--ink); cursor: pointer;
    transition: transform .1s, box-shadow .1s, opacity .25s, background .2s;
    touch-action: manipulation;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--ink); }
  .card:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .card .icon {
    flex: 0 0 auto; width: 54px; height: 54px; display: grid; place-items: center;
    font-size: 28px; border: 3px solid var(--ink); border-radius: 16px;
  }
  .card:nth-child(1) .icon { background: var(--mustard); }
  .card:nth-child(2) .icon { background: var(--mint); }
  .card:nth-child(3) .icon { background: #ff8fa3; }
  .card:nth-child(4) .icon { background: var(--sky); }
  .card.picked { background: var(--mustard); animation: boing .45s cubic-bezier(.3,1.6,.5,1); }
  .card.dim { opacity: .35; transform: scale(.97); }
  @keyframes boing {
    0% { transform: scale(1); }
    35% { transform: translateY(-14px) scale(1.06) rotate(-1.5deg); }
    65% { transform: translateY(2px) scale(.97); }
    100% { transform: translateY(-4px) scale(1.01); }
  }
  .choices.locked .card { pointer-events: none; }

  /* ---------- 결과 화면 ---------- */
  .result-head { text-align: center; }
  .result-head .ant-wrap { width: clamp(120px, 32vw, 170px); margin: 0 auto; }
  .type-card { text-align: center; margin-top: 4px; position: relative; overflow: hidden; }
  .type-card::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px;
    background: var(--type-color, var(--mustard)); border-bottom: 3px solid var(--ink);
  }
  .type-code { display: inline-flex; gap: 8px; margin: 12px 0 8px; }
  .type-code b {
    font-family: "Black Han Sans", sans-serif; font-weight: 400; font-size: 26px;
    width: 46px; height: 46px; display: grid; place-items: center;
    background: var(--type-color, var(--mustard)); border: 3px solid var(--ink); border-radius: 12px;
    box-shadow: 0 4px 0 var(--ink);
  }
  .type-name {
    font-family: "Black Han Sans", sans-serif; font-size: clamp(28px, 7.4vw, 40px); margin: 6px 0 12px;
    line-height: 1.2; word-break: keep-all;
  }
  .type-desc { font-size: 18px; line-height: 1.65; margin: 0; word-break: keep-all; }
  .section-title { font-family: "Black Han Sans", sans-serif; font-size: 23px; margin: 30px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ""; width: 14px; height: 14px; background: var(--tomato); border: 3px solid var(--ink); border-radius: 50%; }

  .timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .timeline li { display: flex; align-items: center; gap: 12px; font-size: 18px; line-height: 1.35; }
  .timeline .when {
    flex: 0 0 auto; min-width: 80px; text-align: center; font-size: 15px;
    background: var(--mint); border: 3px solid var(--ink); border-radius: 999px; padding: 3px 8px 1px;
  }
  .timeline .what { word-break: keep-all; }

  .meters { display: grid; gap: 14px; }
  .meter-title { font-size: 15px; opacity: .75; margin-bottom: 4px; }
  .meter { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .meter .side { flex: 0 0 auto; width: 6.6em; }
  .meter .side.r { text-align: right; }
  .meter .side.win { color: var(--tomato-d); }
  .meter .bar { flex: 1; height: 20px; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; display: flex; background: var(--white); }
  .meter .bar i { display: block; height: 100%; }
  .meter .bar i.l { background: var(--mustard); border-right: 3px solid var(--ink); }
  .meter .bar i.r { background: var(--mint); flex: 1; }

  .vision { background: var(--cream-2); }
  .vision .quote { font-size: 16px; opacity: .8; margin: 0 0 14px; line-height: 1.5; }
  .summary { font-size: 19px; line-height: 1.7; margin: 0 0 14px; word-break: keep-all; }
  .summary mark { background: linear-gradient(transparent 55%, rgba(255,197,49,.85) 55%); color: inherit; padding: 0 2px; }
  .comp-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .comp-row span { font-size: 15px; background: var(--white); border: 3px solid var(--ink); border-radius: 999px; padding: 4px 12px 2px; }
  .comp-row span::before { content: "✔ "; color: var(--tomato); }
  .fit { font-size: 17px; line-height: 1.6; margin: 0; word-break: keep-all; }

  /* ---------- 신청서 화면 (공문서 톤) ---------- */
  #application .lead { text-align: center; font-size: 20px; margin: 0 0 16px; }
  .paper-wrap { position: relative; max-width: 640px; margin: 0 auto; }
  .paper {
    position: relative;
    background-color: #f7f1e1;
    background-image:
      linear-gradient(rgba(120, 90, 40, .05) 1px, transparent 1px),
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.7), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(170,130,60,.12), transparent 45%);
    background-size: 100% 7px, 100% 100%, 100% 100%;
    color: #222;
    font-family: "Nanum Myeongjo", "Batang", serif;
    padding: 34px 30px 36px;
    border: 1px solid #c9bc9b;
    box-shadow: 0 2px 0 #e6dcc3, 0 12px 28px rgba(60, 40, 10, .25);
  }
  .paper .doc-top { display: flex; justify-content: space-between; font-size: 12px; color: #555; border-bottom: 1px solid #555; padding-bottom: 6px; }
  .paper h2 { text-align: center; font-weight: 800; font-size: clamp(22px, 5.8vw, 30px); letter-spacing: .25em; margin: 22px 0 6px; }
  .paper .org { text-align: center; font-size: 14px; margin: 0 0 22px; letter-spacing: .05em; }
  .form { width: 100%; border-collapse: collapse; font-size: 14.5px; table-layout: fixed; }
  .form th, .form td { border: 1.5px solid #333; padding: 9px 10px; vertical-align: middle; line-height: 1.5; word-break: keep-all; }
  .form th { background: rgba(110, 90, 50, .1); font-weight: 700; width: 22%; text-align: center; }
  .form td.name { font-family: "Nanum Pen Script", cursive; font-size: 26px; line-height: 1; }
  .form .period { width: 22%; text-align: center; white-space: nowrap; }
  .form .sub th { font-size: 13px; padding: 5px; background: rgba(110, 90, 50, .06); }
  .form td.type-cell { font-weight: 700; }
  .form td.type-cell small { font-weight: 400; color: #555; display: block; font-size: 12.5px; margin-top: 2px; }
  .paper .pledge { text-align: center; margin: 26px 0 8px; font-size: 15px; line-height: 1.7; word-break: keep-all; }
  .paper .date { text-align: center; margin: 0 0 22px; font-size: 15px; letter-spacing: .1em; }
  .paper .sign { position: relative; text-align: right; font-size: 15px; padding-right: 4px; }
  .paper .sign .sig { font-family: "Nanum Pen Script", cursive; font-size: 32px; margin: 0 10px; vertical-align: -4px; color: #1d3c8f; }
  .paper .recipient { text-align: center; font-weight: 800; font-size: clamp(15px, 4vw, 19px); margin: 30px 0 0; letter-spacing: .08em; }

  .stamp {
    position: absolute; right: 6%; bottom: 74px; z-index: 5;
    width: 132px; height: 132px; border-radius: 50%;
    border: 6px solid #d6281f; color: #d6281f;
    display: none; place-items: center; text-align: center;
    box-shadow: inset 0 0 0 4px #f7f1e1, inset 0 0 0 7px #d6281f;
    font-family: "Black Han Sans", sans-serif; opacity: .9;
    transform: rotate(-14deg);
    pointer-events: none;
  }
  .stamp .big { font-size: 46px; line-height: 1; letter-spacing: 4px; display: block; }
  .stamp .small { font-family: "Jua", sans-serif; font-size: 11px; letter-spacing: 1px; display: block; margin-top: 4px; }
  .stamp.slam { display: grid; animation: slam .55s cubic-bezier(.5,0,.3,1) forwards; }
  .stamp.done { display: grid; }
  @keyframes slam {
    0%   { opacity: 0; transform: translateY(-220px) scale(2.8) rotate(-4deg); }
    50%  { opacity: 1; transform: translateY(0) scale(1.22) rotate(-14deg); }
    66%  { transform: translateY(0) scale(.92) rotate(-14deg); }
    82%  { transform: translateY(0) scale(1.04) rotate(-14deg); }
    100% { opacity: .9; transform: translateY(0) scale(1) rotate(-14deg); }
  }
  .ink-burst {
    position: absolute; right: calc(6% + 66px); bottom: 140px; width: 0; height: 0; z-index: 4; pointer-events: none;
  }
  .ink-burst i {
    position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #d6281f; opacity: 0;
  }
  .ink-burst.go i { animation: splat .5s ease-out forwards; }
  @keyframes splat {
    0% { opacity: .8; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.3); }
  }
  .approved-msg { text-align: center; font-size: 22px; margin: 22px 0 0; visibility: hidden; }
  .approved-msg.show { visibility: visible; animation: popIn .4s cubic-bezier(.2,1.4,.4,1); }
  .after-submit { display: none; }
  .after-submit.show { display: flex; animation: popIn .4s cubic-bezier(.2,1.4,.4,1); }

  @media (max-width: 480px) {
    .btn { font-size: 20px; padding: 12px 28px 10px; }
    .paper { padding: 24px 14px 28px; }
    .form { font-size: 13px; }
    .form th, .form td { padding: 7px 6px; }
    .stamp { width: 104px; height: 104px; bottom: 70px; right: 4%; }
    .stamp .big { font-size: 36px; }
    .stamp .small { font-size: 9px; }
    .ink-burst { right: calc(4% + 52px); bottom: 122px; }
    .meter .side { width: 5.8em; font-size: 14px; }
    .timeline li { font-size: 16px; }
    .timeline .when { min-width: 70px; font-size: 13px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="confetti" aria-hidden="true">
  <span style="left:6%;top:12%;background:var(--mustard)"></span>
  <span style="left:88%;top:8%;background:var(--mint);animation-delay:-2s"></span>
  <span style="left:92%;top:56%;background:var(--tomato);animation-delay:-1s;width:16px;height:16px"></span>
  <span style="left:3%;top:68%;background:var(--sky);animation-delay:-3s"></span>
  <span style="left:48%;top:93%;background:var(--mustard);animation-delay:-4s;width:14px;height:14px"></span>
</div>

<main id="app">
  <!-- 1. 시작 -->
  <section class="screen active" id="start">
    <h1 class="title" id="startTitle"></h1>
    <p class="subtitle" id="startSubtitle"></p>
    <div class="hero"><div class="ant-slot"></div></div>
    <div class="nametag" id="startName"></div>
    <div class="btn-row"><button class="btn" id="startBtn"></button></div>
  </section>

  <!-- 2. 선택 x5 -->
  <section class="screen" id="question">
    <div class="progress">
      <div class="segs" id="progressSegs"></div>
      <div class="count" id="progressCount"></div>
    </div>
    <div class="scene">
      <div class="ant-wrap"><div class="ant-slot"></div></div>
      <div class="bubble">
        <span class="chip" id="qPeriod"></span>
        <p id="qText"></p>
      </div>
    </div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- 3. 결과 -->
  <section class="screen" id="result">
    <div class="result-head">
      <div class="ant-wrap"><div class="ant-slot cheer"></div></div>
    </div>
    <div class="panel type-card" id="typeCard">
      <div class="type-code" id="typeCode"></div>
      <div class="type-name" id="typeName"></div>
      <p class="type-desc" id="typeDesc"></p>
    </div>

    <div class="section-title">Ant의 1년</div>
    <div class="panel"><ul class="timeline" id="timeline"></ul></div>

    <div class="section-title">창조자 성향</div>
    <div class="panel"><div class="meters" id="meters"></div></div>

    <div class="section-title" id="visionTitle"></div>
    <div class="panel vision">
      <p class="quote" id="visionText"></p>
      <p class="summary" id="summary"></p>
      <div class="comp-row" id="compRow"></div>
      <p class="fit" id="fit"></p>
    </div>

    <div class="btn-row"><button class="btn" id="toAppBtn"></button></div>
  </section>

  <!-- 4~5. 신청서 -->
  <section class="screen" id="application">
    <p class="lead">📝 신청서를 확인하고 제출해 보세요!</p>
    <div class="paper-wrap">
      <div class="paper" id="paper">
        <div class="doc-top"><span id="docNo"></span><span id="docOrgTop"></span></div>
        <h2 id="docTitle"></h2>
        <p class="org" id="docOrg"></p>
        <table class="form">
          <tbody id="formBody"></tbody>
        </table>
        <p class="pledge" id="pledge"></p>
        <p class="date" id="docDate"></p>
        <div class="sign" id="sign"></div>
        <p class="recipient" id="recipient"></p>
        <div class="ink-burst" id="inkBurst"></div>
        <div class="stamp" id="stamp"><div><span class="big" id="stampBig"></span><span class="small" id="stampSmall"></span></div></div>
      </div>
    </div>
    <p class="approved-msg" id="approvedMsg"></p>
    <div class="btn-row" id="submitRow"><button class="btn" id="submitBtn"></button></div>
    <div class="btn-row after-submit" id="afterRow">
      <button class="btn mint" id="saveBtn"></button>
      <button class="btn yellow" id="restartBtn"></button>
    </div>
  </section>
</main>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const state = { step: 0, picks: [], busy: false };

  /* ---------- Ant SVG (오리지널 캐릭터) ---------- */
  const INK = "#2a1a12", BODY = "#d9542f", BODY2 = "#c4432a";
  function antSVG(cls = "") {
    return `
<svg class="ant ${cls}" viewBox="0 0 200 230" aria-label="Ant 캐릭터" role="img">
 <g class="bob">
  <g stroke="${INK}" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M80 152 Q56 162 50 184"/><path d="M120 152 Q144 162 150 184"/>
    <path d="M84 196 Q68 208 64 224"/><path d="M116 196 Q132 208 136 224"/>
  </g>
  <ellipse cx="100" cy="186" rx="42" ry="32" fill="${BODY2}" stroke="${INK}" stroke-width="6"/>
  <path d="M68 180 Q100 194 132 180" stroke="${INK}" stroke-width="4" fill="none" stroke-linecap="round"/>
  <ellipse cx="86" cy="174" rx="10" ry="5" fill="#fff" opacity=".3"/>
  <ellipse cx="100" cy="143" rx="24" ry="18" fill="${BODY2}" stroke="${INK}" stroke-width="6"/>
  <g class="arm-l"><path d="M80 140 Q60 134 50 116" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="49" cy="112" r="8" fill="${BODY}" stroke="${INK}" stroke-width="5"/></g>
  <g class="arm-r"><path d="M120 140 Q140 134 150 116" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="151" cy="112" r="8" fill="${BODY}" stroke="${INK}" stroke-width="5"/></g>
  <g class="antenna-l"><path d="M84 48 Q72 20 52 14" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="49" cy="13" r="10" fill="#ffc531" stroke="${INK}" stroke-width="5"/></g>
  <g class="antenna-r"><path d="M116 48 Q128 20 148 14" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="151" cy="13" r="10" fill="#ffc531" stroke="${INK}" stroke-width="5"/></g>
  <circle cx="100" cy="90" r="50" fill="${BODY}" stroke="${INK}" stroke-width="6"/>
  <ellipse cx="76" cy="70" rx="12" ry="7" fill="#fff" opacity=".35" transform="rotate(-30 76 70)"/>
  <path d="M56 62 Q64 30 104 30 Q146 32 146 60 Q118 50 56 62Z" fill="#4fd1b0" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="108" cy="28" r="6" fill="#4fd1b0" stroke="${INK}" stroke-width="5"/>
  <g class="eyes">
    <ellipse cx="82" cy="92" rx="8" ry="11" fill="${INK}"/><circle cx="85" cy="87" r="3.2" fill="#fff"/>
    <ellipse cx="118" cy="92" rx="8" ry="11" fill="${INK}"/><circle cx="121" cy="87" r="3.2" fill="#fff"/>
  </g>
  <ellipse cx="67" cy="108" rx="9" ry="5" fill="#ff9aa2" opacity=".9"/>
  <ellipse cx="133" cy="108" rx="9" ry="5" fill="#ff9aa2" opacity=".9"/>
  <path d="M90 108 Q100 122 110 108 Z" fill="#7a1f14" stroke="${INK}" stroke-width="4.5" stroke-linejoin="round"/>
 </g>
</svg>`;
  }
  document.querySelectorAll(".ant-slot").forEach(el => { el.innerHTML = antSVG(el.classList.contains("cheer") ? "cheer" : ""); });

  /* ---------- 조사 자동 처리 ---------- */
  const JOSA = { "을/를": ["을", "를"], "이/가": ["이", "가"], "은/는": ["은", "는"], "와/과": ["과", "와"], "과/와": ["과", "와"], "으로/로": ["으로", "로"] };
  function applyJosa(text) {
    return text.replace(/([\s\S])\((을\/를|이\/가|은\/는|와\/과|과\/와|으로\/로)\)/g, (m, ch, key) => {
      const code = ch.charCodeAt(0);
      let jong = 0;
      if (code >= 0xac00 && code <= 0xd7a3) jong = (code - 0xac00) % 28;
      const [withB, noB] = JOSA[key];
      if (key === "으로/로") return ch + (jong === 0 || jong === 8 ? noB : withB);
      return ch + (jong ? withB : noB);
    });
  }

  /* ---------- 시작 화면 ---------- */
  const t = GAME.title;
  $("#startTitle").innerHTML = t.includes("아텍") ? esc(t).replace("아텍", '<span class="accent">아텍</span>') : esc(t);
  $("#startSubtitle").textContent = GAME.subtitle;
  $("#startName").textContent = GAME.player.name;
  $("#startBtn").textContent = GAME.startButton;
  $("#toAppBtn").textContent = GAME.buttons.toApplication;
  $("#submitBtn").textContent = GAME.application.submitButton;
  $("#saveBtn").textContent = GAME.buttons.save;
  $("#restartBtn").textContent = GAME.buttons.restart;

  function show(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
    window.scrollTo({ top: 0 });
  }

  $("#startBtn").onclick = () => { state.step = 0; state.picks = []; renderQuestion(); show("question"); };

  /* ---------- 선택 화면 ---------- */
  function renderQuestion() {
    const total = GAME.questions.length;
    const q = GAME.questions[state.step];
    $("#progressSegs").style.gridTemplateColumns = `repeat(${total}, 1fr)`;
    $("#progressSegs").innerHTML = GAME.questions.map((_, i) =>
      `<div class="seg ${i < state.step ? "done" : i === state.step ? "now" : ""}"></div>`).join("");
    $("#progressCount").textContent = `${state.step + 1} / ${total}`;
    $("#qPeriod").textContent = q.period;
    $("#qText").textContent = q.question;
    const box = $("#choices");
    box.classList.remove("locked");
    box.innerHTML = q.choices.map((c, i) =>
      `<button class="card" data-i="${i}"><span class="icon">${esc(c.icon || "")}</span><span>${esc(c.label)}</span></button>`).join("");
    box.querySelectorAll(".card").forEach(btn => btn.onclick = () => pick(+btn.dataset.i, btn));
    const sc = document.querySelector("#question .scene");
    sc.style.animation = "none"; sc.offsetHeight; sc.style.animation = "popIn .4s cubic-bezier(.2,1.4,.4,1)";
  }

  function pick(i, btn) {
    if (state.busy) return;
    state.busy = true;
    const box = $("#choices");
    box.classList.add("locked");
    box.querySelectorAll(".card").forEach(c => c.classList.add(c === btn ? "picked" : "dim"));
    state.picks[state.step] = GAME.questions[state.step].choices[i];
    setTimeout(() => {
      state.busy = false;
      state.step++;
      if (state.step < GAME.questions.length) { renderQuestion(); window.scrollTo({ top: 0 }); }
      else { renderResult(); renderApplication(); show("result"); }
    }, 620);
  }

  /* ---------- 결과 화면 ---------- */
  let result = null;

  function renderResult() {
    result = computeType(state.picks);
    const type = GAME.types[result.code];
    const card = $("#typeCard");
    card.style.setProperty("--type-color", type.color);
    $("#typeCode").innerHTML = result.code.split("").map(c => `<b>${c}</b>`).join("");
    $("#typeCode").style.setProperty("--type-color", type.color);
    $("#typeName").textContent = type.name;
    $("#typeDesc").textContent = type.desc;

    $("#timeline").innerHTML = state.picks.map((c, i) =>
      `<li><span class="when">${esc(GAME.questions[i].period)}</span><span class="what">${esc(c.icon || "")} ${esc(c.label)}</span></li>`).join("");

    $("#meters").innerHTML = GAME.axes.map(ax => {
      const l = result.scores[ax.left], r = result.scores[ax.right];
      const pct = l + r === 0 ? 50 : Math.round(l / (l + r) * 100);
      const win = result.code.includes(ax.left) ? "l" : "r";
      return `<div>
        <div class="meter-title">${esc(ax.title)}</div>
        <div class="meter">
          <span class="side ${win === "l" ? "win" : ""}">${ax.left} ${esc(ax.labels[ax.left])} ${l}</span>
          <span class="bar"><i class="l" style="width:${pct}%;${pct === 0 ? "border:0" : ""}"></i><i class="r"></i></span>
          <span class="side r ${win === "r" ? "win" : ""}">${r} ${esc(ax.labels[ax.right])} ${ax.right}</span>
        </div></div>`;
    }).join("");

    $("#visionTitle").textContent = GAME.vision.title;
    $("#visionText").textContent = "“" + GAME.vision.text + "”";
    $("#summary").innerHTML = buildSummaryHTML(result.code);
    $("#compRow").innerHTML = GAME.vision.competencies.map(c => `<span>${esc(c)}</span>`).join("");
    $("#fit").textContent = `${GAME.player.name}는 ‘${type.name}’. ${type.fit}`;
  }

  function buildSummaryHTML(code) {
    const vals = { competency: GAME.competencyByWeapon[code[0]], impact: GAME.impactByDirection[code[2]] };
    const byRole = {};
    GAME.questions.forEach((q, i) => (byRole[q.role] = byRole[q.role] || []).push(state.picks[i].phrase));
    Object.entries(byRole).forEach(([role, list]) => {
      list.forEach((p, i) => vals[role + (i + 1)] = p);
      vals[role] = list[0];
    });
    // 1) 값 채우고 조사 처리 (평문) 2) 값 부분만 <mark>
    const parts = [];
    let plain = GAME.summaryTemplate.replace(/\{(\w+)\}/g, (m, k) => {
      if (vals[k] == null) return m;
      parts.push(vals[k]);
      return vals[k];
    });
    plain = applyJosa(plain);
    let html = esc(plain);
    [...new Set(parts)].sort((a, b) => b.length - a.length).forEach(p => {
      html = html.split(esc(p)).join(`\u0001${esc(p)}\u0002`);
    });
    return html.replace(/\u0001/g, "<mark>").replace(/\u0002/g, "</mark>");
  }

  /* ---------- 신청서 ---------- */
  function renderApplication() {
    const A = GAME.application, L = A.labels, type = GAME.types[result.code];
    $("#docNo").textContent = A.docNo;
    $("#docOrgTop").textContent = A.org;
    $("#docTitle").textContent = A.title;
    $("#docOrg").textContent = A.org;
    const rows = state.picks.map((c, i) =>
      `<tr><td class="period">${esc(GAME.questions[i].period)}</td><td colspan="3">${esc(c.log)}</td></tr>`).join("");
    $("#formBody").innerHTML = `
      <tr><th>${esc(L.name)}</th><td class="name">${esc(GAME.player.name)}</td><th>${esc(L.major)}</th><td>${esc(GAME.player.major)}</td></tr>
      <tr><th>${esc(L.type)}</th><td colspan="3" class="type-cell">${result.code.split("").join("·")} ${esc(type.name)}
        <small>${GAME.axes.map(ax => esc(ax.title) + ": " + esc(ax.labels[result.code[GAME.axes.indexOf(ax)]])).join(" / ")}</small></td></tr>
      <tr><th colspan="4">${esc(L.log)}</th></tr>
      <tr class="sub"><th>${esc(L.period)}</th><th colspan="3">${esc(L.content)}</th></tr>
      ${rows}
      <tr><th>${esc(L.reason)}</th><td colspan="3">${esc(type.fit)}</td></tr>`;
    $("#pledge").textContent = A.pledge;
    $("#docDate").textContent = A.date;
    $("#sign").innerHTML = `${esc(A.signLabel)} <span class="sig">${esc(GAME.player.name)}</span> (서명)`;
    $("#recipient").textContent = A.recipient;
    $("#stampBig").textContent = A.stampText;
    $("#stampSmall").textContent = A.stampSub;
    $("#approvedMsg").textContent = A.approvedMessage;
    resetStamp();
  }

  function resetStamp() {
    const st = $("#stamp");
    st.className = "stamp";
    $("#inkBurst").className = "ink-burst";
    $("#approvedMsg").classList.remove("show");
    $("#submitRow").style.display = "";
    $("#afterRow").classList.remove("show");
  }

  $("#toAppBtn").onclick = () => show("application");

  $("#submitBtn").onclick = () => {
    $("#submitRow").style.display = "none";
    const paper = $("#paper");
    paper.scrollIntoView({ behavior: "smooth", block: "end" });
    setTimeout(() => {
      const st = $("#stamp");
      st.className = "stamp slam";
      setTimeout(() => {
        const app = $("#app");
        app.classList.remove("shake"); app.offsetWidth; app.classList.add("shake");
        const burst = $("#inkBurst");
        burst.innerHTML = Array.from({ length: 10 }, (_, i) => {
          const a = i / 10 * Math.PI * 2, d = 80 + Math.random() * 30;
          return `<i style="--dx:${Math.cos(a) * d}px;--dy:${Math.sin(a) * d}px"></i>`;
        }).join("");
        burst.className = "ink-burst go";
        if (navigator.vibrate) navigator.vibrate(60);
      }, 275);
      st.addEventListener("animationend", () => {
        st.className = "stamp done";   // 이미지 저장 시 애니메이션 없이 최종 상태로 캡처되도록
        $("#approvedMsg").classList.add("show");
        setTimeout(() => $("#afterRow").classList.add("show"), 350);
      }, { once: true });
    }, 350);
  };

  $("#saveBtn").onclick = async () => {
    if (typeof html2canvas !== "function") { alert("이미지 저장 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
    const btn = $("#saveBtn"), label = btn.textContent;
    btn.textContent = "저장 중…"; btn.disabled = true;
    try {
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      const canvas = await html2canvas($("#paper"), { scale: 2, backgroundColor: "#f7f1e1", useCORS: true });
      const a = document.createElement("a");
      a.download = `${GAME.player.name}_아텍_신청서.png`;
      a.href = canvas.toDataURL("image/png");
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) {
      console.error(e); alert("이미지 저장 중 문제가 생겼어요.");
    } finally {
      btn.textContent = label; btn.disabled = false;
    }
  };

  $("#restartBtn").onclick = () => { resetStamp(); state.step = 0; state.picks = []; show("start"); };
})();
</script>
</body>
</html>
